# cargo deny check: known vulnerabilities, licences, and where crates come from.
[graph]
all-features = false

[advisories]
# Unmaintained or yanked crates and RustSec advisories fail the check unless listed here with a reason.
ignore = [
  # All four are unmaintained-crate notices (no known vulnerability), pulled in by Tauri itself:
  # gtk-rs 0.18 on Linux (tauri → muda → gtk → glib-macros) and zbus via tauri-plugin-opener.
  # They go when Tauri moves off them; recheck on each Tauri upgrade.
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error via Tauri's gtk-rs 0.18 (Linux)" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant via tauri-plugin-opener's zbus" },
  { id = "RUSTSEC-2026-0371", reason = "zvariant_derive via tauri-plugin-opener's zbus" },
  { id = "RUSTSEC-2026-0372", reason = "zbus_names via tauri-plugin-opener's zbus" },
]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CC0-1.0", "BSL-1.0", "0BSD", "CDLA-Permissive-2.0"]
confidence-threshold = 0.9
# yaah itself isn't published.
private = { ignore = true }

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[package]
name = "yaah"
publish = false
version = "0.3.1"
description = "yaah — yet another agent harness"
authors = ["yaah"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "yaah_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt", "macros", "time"] }
tauri-plugin-dialog = "2"
tiny_http = "0.12"
base64 = "0.22"
sysinfo = "0.37"
tokio-postgres = "0.7"
postgres-native-tls = "0.5"
native-tls = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "native-tls", "charset", "http2", "system-proxy"] }
sha2 = "0.10"
# Model-provider secrets (the OpenRouter key) in the OS keychain: macOS Keychain, Linux Secret Service (pure-Rust zbus).
keyring = { version = "=4.2.0", default-features = false, features = ["v1"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

# End-to-end tests against a scripted ACP agent. The test binary is also the
# agent (it re-runs itself in agent mode), so it has its own main.
[[test]]
name = "acp_e2e"
path = "tests/acp_e2e/main.rs"
harness = false

[lints.rust]
# No unsafe in yaah's own code (the login-shell PATH goes to each child instead of set_var).
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Documentation lints: this is an app, not a published library.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"

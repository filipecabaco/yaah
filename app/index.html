<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>yaah</title>
    <!--
      The start-up indicator: the yaah mark's tiles sliding together, holding, and sliding on, in a
      loop. It lives here, outside the bundle, so it shows before any script runs; React replaces it
      when the app mounts, and <Mark loading> reuses the same animation while the app loads.
    -->
    <style>
      html {
        background: #fff;
        color: #18181b;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #0a0a0a;
          color: #fafafa;
        }
      }
      .yaah-boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }
      .yaah-boot svg {
        width: 56px;
        height: 56px;
      }
      .yaah-boot .fill-current {
        fill: currentColor;
      }
      .yaah-boot .fill-brand {
        fill: oklch(0.72 0.17 55);
      }
      .yaah-mark[data-loading] rect {
        transform-box: fill-box;
        transform-origin: center;
        animation: yaah-slide 2100ms cubic-bezier(0.16, 1, 0.3, 1) infinite both;
      }
      .yaah-mark[data-loading] rect[data-tile="1"] {
        --from: translateY(-45%);
      }
      .yaah-mark[data-loading] rect[data-tile="0"] {
        --from: translateX(-90%);
        animation-delay: 90ms;
      }
      .yaah-mark[data-loading] rect[data-tile="3"] {
        --from: translateX(-70%);
        animation-delay: 180ms;
      }
      /* The agent's piece slides in last and locks the "y". */
      .yaah-mark[data-loading] rect[data-tile="2"] {
        --from: translateX(-110%);
        animation-delay: 300ms;
      }
      @keyframes yaah-slide {
        0% {
          transform: var(--from);
          opacity: 0;
        }
        24% {
          transform: none;
          opacity: 1;
        }
        68% {
          transform: none;
          opacity: 1;
        }
        86%,
        100% {
          transform: translateX(35%);
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .yaah-mark[data-loading] rect {
          animation: yaah-breathe 1600ms ease-in-out infinite alternate;
          animation-delay: 0ms;
        }
        @keyframes yaah-breathe {
          from {
            opacity: 0.45;
          }
          to {
            opacity: 1;
          }
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="yaah-boot" role="status" aria-label="Starting yaah">
        <svg viewBox="-10 -5 70 70" class="yaah-mark" data-loading aria-hidden="true">
          <rect data-tile="0" x="0" y="0" width="16" height="22" rx="5" class="fill-current" />
          <rect data-tile="1" x="34" y="0" width="16" height="60" rx="5" class="fill-current" />
          <rect data-tile="2" x="0" y="25" width="31" height="16" rx="5" class="fill-brand" />
          <rect data-tile="3" x="8" y="44" width="23" height="16" rx="5" class="fill-current" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
